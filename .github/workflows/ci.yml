name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A hung test should fail fast with a log, not be cancelled silently at the runner limit.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # pretest rebuilds the plugin bundle, so the bundle test checks what we'd ship
      - run: npm test -- --reporter=verbose
        timeout-minutes: 8

  relay-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
